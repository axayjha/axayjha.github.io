<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.name }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  {% feed_meta %}
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">A.</a>
      <div class="nav-links">
        <a href="/work" {% if page.url contains '/work' %}class="active"{% endif %}>Work</a>
        <a href="/words" {% if page.url contains '/words' or page.url contains '/blogs' %}class="active"{% endif %}>Words</a>
        <a href="/frames" {% if page.url contains '/frames' %}class="active"{% endif %}>Frames</a>
        <a href="/shelf" {% if page.url contains '/shelf' %}class="active"{% endif %}>Shelf</a>
        <a href="/hello" {% if page.url contains '/hello' %}class="active"{% endif %}>Hello</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu">
    <a href="/work">Work</a>
    <a href="/words">Words</a>
    <a href="/frames">Frames</a>
    <a href="/shelf">Shelf</a>
    <a href="/hello">Hello</a>
  </div>

  <main class="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="https://github.com/axayjha" target="_blank" rel="noopener">GitHub</a>
        <a href="https://linkedin.com/in/axayjha" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://instagram.com/axayjha" target="_blank" rel="noopener">Instagram</a>
        <a href="https://youtube.com/channel/UCJY97Jho8umvhFeb-Qk-4jg" target="_blank" rel="noopener">YouTube</a>
      </div>
      <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} Akshay Anand</p>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
