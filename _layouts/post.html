---
layout: default
---

<article class="post-page">
  <header class="post-header">
    <time class="post-date">{{ page.date | date: "%B %d, %Y" }}</time>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
