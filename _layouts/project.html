---
layout: default
---

<article class="project-page">
  <header class="project-page-header">
    <span class="project-page-eyebrow">Project - {{ page.date | date: "%Y" }}</span>
    <h1 class="project-page-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="project-page-description">{{ page.description }}</p>
    {% endif %}
    {% if page.tags %}
    <div class="project-tags" style="margin-top: 20px;">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
    {% if page.github %}
    <div style="margin-top: 24px;">
      <a href="{{ page.github }}" target="_blank" rel="noopener" class="btn-secondary">View on GitHub &rarr;</a>
    </div>
    {% endif %}
  </header>

  <div class="project-page-content">
    {{ content }}
  </div>
</article>
