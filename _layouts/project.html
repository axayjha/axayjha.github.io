---
layout: default
---

<article class="post-page">
  <header class="post-header">
    <time class="post-date">{{ page.date | date: "%Y" }}</time>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {% endif %}
    {% if page.tags %}
    <div class="project-tags" style="margin-top: 16px;">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
    {% if page.github %}
    <a href="{{ page.github }}" target="_blank" rel="noopener" class="btn-secondary" style="margin-top: 20px;">View on GitHub &rarr;</a>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
